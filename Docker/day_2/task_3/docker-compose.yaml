version: "3.8"

services:
  db:
    image: mysql
    environment:
      MYSQL_DATABASE: "mysql"
      MYSQL_USER_FILE: "/run/secrets/mysql_user"
      MYSQL_PASSWORD_FILE: "/run/secrets/mysql_password"
      MYSQL_ROOT_PASSWORD_FILE: "/run/secrets/mysql_password"
    volumes:
      - mysql:/var/lib/mysql
    secrets:
      - mysql_user
      - mysql_password
    networks:
      - app_net

  web:
    image: webserver
    
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: "mysql"
      DB_USER_FILE: "/run/secrets/mysql_user"
      DB_PASS_FILE: "/run/secrets/mysql_password"
    volumes:
      - webserver:/var/www/html
    depends_on:
      - db
    secrets:
      - mysql_user
      - mysql_password
    networks:
      - app_net

volumes:
  mysql:
    external: true
  webserver:
    external: true

secrets:
  mysql_user:
    external: true
  mysql_password:
    external: true

networks:
  app_net:
