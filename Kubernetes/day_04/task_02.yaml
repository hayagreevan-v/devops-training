apiVersion: apps/v1
kind: Deployment
metadata:
  name: d04-t02
spec:
  template:
    metadata:
      name: d04-t02
      labels:
        app: webapp
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
      nodeSelector:
        app: webapp
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "webapp"
        effect: "NoSchedule"

  selector:
    matchLabels:
      app: webapp