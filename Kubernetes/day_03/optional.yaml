apiVersion: v1
kind: Pod
metadata:
  name: custom-nginx
spec:
  containers:
  - name: hello-world
    image: hayagreevanv/hello-world-nginx
    resources:
      requests:
        memory: 100Mi
        cpu: 200m
      limits:
        memory: 200Mi
        cpu: 400m
  imagePullSecrets:
  - name: regcred